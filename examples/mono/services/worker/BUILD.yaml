targets:
  - name: worker
    srcs: [jobs.txt, "jobs.d/*.txt"]
    deps: [//lib/mathx:mathx]
    cmd: |
      sleep 0.3; { echo "jobs=$(cat $SRCS | wc -l)"; echo "budget=$(cat lib/mathx/sum.out)"; cat $SRCS | sort; } > $OUT
    outs: [worker.bin]
  - name: worker_test
    srcs: [worker_test.sh]
    deps: [":worker"]
    cmd: |
      sh services/worker/worker_test.sh
    test: true
